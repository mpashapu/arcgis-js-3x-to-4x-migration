name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check shared/geo-utils.js
          node --check shared/panel.js
          node --check shared/config.js
          node --check v3/js/main.js
          node --check --input-type=module < v4/js/main.js
      - name: Unit tests
        run: npm test
